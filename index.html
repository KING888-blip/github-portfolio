<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALIK_PRO2 | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0a0f1c;
    color:#fff;
}

/* HERO */
.banner{
    height:100vh;
    background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1606112219348-204d7d8b94ee?auto=format&fit=crop&w=1950&q=80');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content{
    max-width:800px;
}

.profile{
    width:160px;
    height:160px;
    border-radius:50%;
    border:4px solid #00aaff;
    margin:auto;
    margin-bottom:25px;
    background:#111;
    box-shadow:0 0 40px #00aaff;
}

h1 span{
    color:#00aaff;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 35px;
    background:#00aaff;
    border-radius:30px;
    text-decoration:none;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    box-shadow:0 0 25px #00aaff;
    transform:translateY(-4px);
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transition:0.3s;
}

.modal-content{
    background:#111c2e;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px #00aaff;
    transform:scale(0.7);
    transition:0.3s;
}

.modal h2{
    color:#00aaff;
    margin-bottom:15px;
}

.close-btn{
    margin-top:20px;
    padding:10px 25px;
    background:#00aaff;
    border:none;
    border-radius:20px;
    color:white;
    cursor:pointer;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal.active .modal-content{
    transform:scale(1);
}

footer{
    text-align:center;
    padding:30px;
    opacity:0.6;
}
</style>
</head>

<body>

<div class="banner">
    <div class="hero-content">
        <div class="profile"></div>
        <h1>Hi, I'm <span>MALIK_PRO2</span></h1>
        <p>Minecraft Developer | Web Developer | Discord Developer</p>
        <button class="btn" onclick="openModal()">View My Work</button>
    </div>
</div>

<!-- MODAL -->
<div class="modal" id="contactModal">
    <div class="modal-content">
        <h2>Contact Me</h2>
        <p>📩 Discord ID:</p>
        <h3 style="color:#00aaff;">malik_pro2</h3>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<footer>
© 2026 MALIK_PRO2 | Executive at Cake MC | Founder of Rampage MC
</footer>

<script>
function openModal(){
    document.getElementById("contactModal").classList.add("active");
}

function closeModal(){
    document.getElementById("contactModal").classList.remove("active");
}
</script>

</body>
</html>
